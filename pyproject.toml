# ---- Project Info and Dependencies ----

[project.urls]
Homepage = "https://github.com/smacke/ffsubsync"
Repository = "https://github.com/tinof/ffsubsync"
Issues = "https://github.com/tinof/ffsubsync/issues"

[project]
name = "ffsubsync"
dynamic = ["version"]
description = "Language-agnostic synchronization of subtitles with video."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Stephen Macke", email = "stephen.macke@gmail.com"}
]
maintainers = [
    {name = "Stephen Macke", email = "stephen.macke@gmail.com"}
]
keywords = ["subtitle", "synchronization", "video", "audio", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",

    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    # This fork is installed from git and is not published to PyPI. This
    # classifier makes PyPI reject an accidental upload.
    "Private :: Do Not Upload",
]
requires-python = ">=3.11"

# ---- Main dependencies ----

dependencies = [
    "chardet",
    "charset_normalizer",
    "faust-cchardet",
    "ffmpeg-python",
    "numpy>=1.12.0",
    "pysubs2>=1.2.0",
    "requests",
    "rich",
    "srt>=3.0.0",
    "tqdm",
    "webrtcvad-wheels",
]

# ---- Dev dependencies ----

[dependency-groups]
build = [
    "hatchling==1.31.0",
    "uv-dynamic-versioning==0.14.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "pyyaml",
    "ruff",
    "codespell",
    "basedpyright",
    "funlog",
]

[project.scripts]
ffsubsync = "ffsubsync:main"
ffs = "ffsubsync:main"
subsync = "ffsubsync:main"
ssync = "ffsubsync.ssync:main"
piecewise-sync = "ffsubsync.tools.piecewise_sync:main"

# ---- Build system ----

# Dynamic versioning from git tags:
# https://github.com/ninoseki/uv-dynamic-versioning/
[build-system]
requires = ["hatchling==1.31.0", "uv-dynamic-versioning==0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
# Recent tags have no "v" prefix (0.4.29); older ones do (v0.4.3).
pattern = "default-unprefixed"

[tool.hatch.build.targets.sdist]
include = [
    "/ffsubsync",
    "/tests",
    "/HISTORY.rst",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
# Flat layout (no src/), kept so merges from upstream stay clean.
packages = ["ffsubsync"]

# ---- Tool Settings ----

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Enable a comprehensive set of rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

# Ignore specific rules that might be too strict for this codebase
ignore = [
    "E501",  # Ignore line too long errors
    "E722",  # Allow bare except (already used in __init__.py)
    "B008",  # Allow function calls in argument defaults
]

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "docs",
]

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]
# Allow print statements in scripts
"scripts/*.py" = ["T201"]

[tool.ruff.lint.isort]
# Configure isort to be compatible with Black
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true
known-first-party = ["ffsubsync"]

[tool.ruff.format]
# Use Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# Respect the global exclude patterns
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "docs",
]

[tool.basedpyright]
# basedpyright powers the Claude Code LSP tool and serves as the CLI type-check step.
# "standard" mode keeps real type errors visible without basedpyright's strictest noise.
typeCheckingMode = "standard"
pythonVersion = "3.11"
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    "docs",
]
# This codebase is partially typed and numpy-heavy; silence "unknown/any" churn so that
# actionable diagnostics (e.g. None-comparison, operator misuse) stand out.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportAny = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportUnusedCallResult = false

[tool.codespell]
skip = "uv.lock,*.srt,*.json,./tests/data,./test-data,./docs"
# ignore-words-list = "foo,bar"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test.",
]
